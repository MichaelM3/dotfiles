[tui.model_availability_nux]
"gpt-5.5" = 4

[mcp_servers.github]
args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github/github-mcp-server"]
command = "docker"
cwd = "/home/unbalanced"
enabled = false

[mcp_servers.docker]
args = ["mcp", "gateway", "run"]
command = "docker"
cwd = "/home/unbalanced"
enabled = true

[projects."/home/unbalanced"]
trust_level = "trusted"

[projects."/home/unbalanced/.codex"]
trust_level = "trusted"

[projects."/home/unbalanced/.config"]
trust_level = "trusted"

[projects."/home/unbalanced/dotfiles"]
trust_level = "trusted"

[projects."/home/unbalanced/Work/lazyslack"]
trust_level = "trusted"

[projects."/home/unbalanced/Work/OnSched/v3"]
trust_level = "trusted"

[projects."/home/unbalanced/Work/TurboThreads/Turbo-Threads"]
trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

